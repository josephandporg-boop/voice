<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cormorant+Garamond:ital,wght@1,600&family=IBM+Plex+Mono:wght@400;500&family=Nunito+Sans:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container" id="entries-container">
    <! -- stuff goes here. -->
  </main>
// lowkey their names could be Copper, Wave, Sage, Burn, and Vixen, or they could be just the colors. i think ill do colors for now.
  <script>
    const voiceEntries = [
      {
        label: "A warm greeting",
        orange: "“Hey!”",
        blue: "‘Whats up!’",
        green: "+How are we doing?+",
        black: "-wasaa-",
        pink: "*heyy*"
      },
      {
        label: "Conversation",
        orange: "“soo... how are you guys doing on this fine day?”",
        blue: "‘I'm doing alright, hbu?’",
        green: "+Doing well.+",
        black: "-I'm good.-",
        pink: "*feelin good.*"
      }
    ];

    // --- render funct
    const container = document.getElementById('entries-container');

    voiceEntries.forEach(item => {
      const article = document.createElement('article');
      article.className = 'entry';
      article.setAttribute('aria-label', item.label);

      article.innerHTML = `
        <p class="voice-orange">${item.orange}</p>
        <p class="voice-blue">${item.blue}</p>
        <p class="voice-green">${item.green}</p>
        <p class="voice-black">${item.black}</p>
        <p class="voice-pink">${item.pink}</p>
      `;

      container.appendChild(article);
    });
  </script>
</body>
</html>
