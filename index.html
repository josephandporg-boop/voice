<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voices</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Cormorant+Garamond:ital,wght@1,600&family=IBM+Plex+Mono:wght@400;500&family=Nunito+Sans:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <article class="entry" aria-label="A warm greeting">
      <p class="voice-exclaim">“Yo!”</p>
      <p class="voice-chill">‘Whats up!’</p>
      <p class="voice-plus">+How are we doing?+</p>
      <p class="voice-dash">-wasaa-</p>
      <p class="voice-soft">*heyy*</p>
    </article>
  </main>
</body>
</html>
